name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Cancel in-progress builds for non-main branches (allow concurrent builds only on main)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    name: Build and Test
    uses: theandiman/recipe-management/.github/workflows/backend-java-ci.yml@main
    permissions:
      contents: read
      actions: write
      packages: read
    with:
      run_sonar: true
      sonar_project_key: theandiman_recipe-management-ai-service
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  cd:
    name: Deploy
    needs: ci
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: theandiman/recipe-management/.github/workflows/backend-java-cloud-run-cd.yml@main
    permissions:
      contents: write
      actions: write
      id-token: write
    with:
      service_name: recipe-ai-service
      artifact_registry_repository: recipe-ai
      use_wif: true
      run_nuclei_scan: true
      zap_rules: "10049\tIGNORE\t(Non-Storable Content - expected for auth-protected endpoints returning 401/403)"
    secrets:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_DEPLOY_SA: ${{ secrets.GCP_DEPLOY_SA }}
